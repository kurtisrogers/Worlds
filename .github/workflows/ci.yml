name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Issue #8. This env applies to every job, including review-e2e when
# that job runs make test-review-e2e. Do not set OPENAI_API_KEY.
# Do not call the live API. The assist flag stays off.
env:
  AI_ASSIST_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run pytest
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run behave
        run: behave features/
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Pre-commit
        run: |
          pre-commit run --all-files

  # Scans this commit for the test job and for review-e2e when #27
  # adds that job. The fixture key exists only in a temporary file.
  openai-key-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject a committed OpenAI-style key
        run: make check-openai-key

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  landing:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/
      - id: deployment
        uses: actions/deploy-pages@v4
