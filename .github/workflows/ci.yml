name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run pytest
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run behave
        run: behave --no-skipped --tags="not @pending-review-panel and not @pending-review-api" features/
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Pre-commit
        run: |
          pre-commit run --all-files

  # Pending panel scenarios fail closed until #5. State and anchor
  # scenarios fail closed until PR #28 is on main. Not the merge gate.
  review-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run chapter review scenarios, including pending
        run: make test-review-e2e
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  landing:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/
      - id: deployment
        uses: actions/deploy-pages@v4
