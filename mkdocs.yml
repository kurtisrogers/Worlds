site_name: Worlds Documentation
site_description: Reader-funded publishing for emerging authors
site_url: https://worlds.example.com

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
    - scheme: slate
      primary: deep orange
      accent: amber
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - Authors:
    - Writing on Worlds: authors/writing.md
    - Rich-Text Editor: authors/rich-text-editor.md
    - Google Sheets: authors/google-sheets.md
    - Google OAuth: authors/google-oauth.md
    - Document Upload: authors/document-upload.md
    - Subscriptions: authors/subscriptions.md
  - Readers:
    - Discovering Stories: readers/discovering.md
    - Your Library: readers/library.md
    - Comments & Reactions: readers/engagement.md
    - Supporting Authors: readers/supporting.md
  - Development:
    - Testing: development/testing.md
    - Stripe Integration: development/stripe.md
    - Stripe Connect: development/stripe-connect.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
