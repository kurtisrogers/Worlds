{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-12">
  <h1 class="font-serif text-3xl font-semibold mb-8">Your profile</h1>
  <form method="post" class="card p-8 space-y-6">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-2" for="display_name">Display name</label>
      <input type="text" name="display_name" id="display_name" value="{{ profile.display_name }}" class="form-input">
    </div>
    <div>
      <label class="block text-sm font-medium mb-2" for="bio">Bio</label>
      <textarea name="bio" id="bio" rows="4" class="form-input">{{ profile.bio }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium mb-2" for="website">Website</label>
      <input type="url" name="website" id="website" value="{{ profile.website }}" class="form-input">
    </div>
    <button type="submit" class="btn-primary">Save profile</button>
  </form>
</div>
{% endblock %}
