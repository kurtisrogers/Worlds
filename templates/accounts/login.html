{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-16">
  <h1 class="font-serif text-3xl font-semibold text-center mb-8">Welcome back</h1>
  <form method="post" class="card p-8 space-y-6">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="text-red-600 text-sm">{{ form.non_field_errors.0 }}</div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium mb-2" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-input" required autofocus>
    </div>
    <div>
      <label class="block text-sm font-medium mb-2" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-input" required>
    </div>
    <button type="submit" class="btn-primary w-full">Sign in</button>
    <p class="text-center text-sm text-stone-500">
      New here? <a href="{% url 'accounts:register' %}" class="text-worlds-600 hover:underline">Create an account</a>
    </p>
  </form>
</div>
{% endblock %}
