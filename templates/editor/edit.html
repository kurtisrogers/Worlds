{% extends "base.html" %}

{% block title %}Editor — {{ chapter.title }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tiptap/core@2.11.5/dist/index.min.css">
<style>
  .tiptap-editor {
    min-height: 70vh;
    font-family: 'Literata', Georgia, serif;
    font-size: 1.125rem;
    line-height: 1.75;
    outline: none;
  }
  .tiptap-editor p { margin-bottom: 1rem; }
  .tiptap-editor h1, .tiptap-editor h2 { font-weight: 600; margin: 1.5rem 0 0.75rem; }
  .tiptap-editor blockquote {
    border-left: 3px solid #dda06a;
    padding-left: 1rem;
    margin: 1rem 0;
    font-style: italic;
    color: #57534e;
  }
  .tiptap-toolbar button.active { background: #f9ede0; }
  .dark .tiptap-toolbar button.active { background: #292524; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col" id="editor-app">
  <header class="border-b border-worlds-200 dark:border-stone-800 bg-white/80 dark:bg-stone-900/80 backdrop-blur sticky top-16 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="{% url 'stories:manage' slug=story.slug %}" class="text-stone-500 hover:text-worlds-600 text-sm">← {{ story.title }}</a>
        <select id="chapter-select" class="form-select text-sm py-1.5 w-auto">
          {% for ch in chapters %}
            <option value="{{ ch.number }}" {% if ch.number == chapter.number %}selected{% endif %}>
              Ch. {{ ch.number }}: {{ ch.title }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="flex items-center gap-3">
        <span id="save-status" class="text-sm text-stone-400"></span>
        <button type="button" id="save-btn" class="btn-primary text-sm">Save</button>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 py-8">
    <input type="text" id="chapter-title"
           class="w-full font-serif text-3xl font-semibold bg-transparent border-none outline-none mb-6 placeholder-stone-300"
           placeholder="Chapter title">

    <div class="tiptap-toolbar flex flex-wrap gap-1 mb-4 border-b border-worlds-200 dark:border-stone-800 pb-3">
      <button type="button" data-action="bold" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800"><strong>B</strong></button>
      <button type="button" data-action="italic" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800"><em>I</em></button>
      <button type="button" data-action="strike" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800"><s>S</s></button>
      <button type="button" data-action="h2" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">H2</button>
      <button type="button" data-action="blockquote" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">"</button>
      <button type="button" data-action="bulletList" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">• List</button>
      <button type="button" data-action="orderedList" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">1. List</button>
      <button type="button" data-action="horizontalRule" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">—</button>
      <button type="button" data-action="undo" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">↩</button>
      <button type="button" data-action="redo" class="px-3 py-1.5 rounded-lg text-sm hover:bg-worlds-100 dark:hover:bg-stone-800">↪</button>
    </div>

    <div id="tiptap-editor" class="tiptap-editor text-stone-800 dark:text-stone-200"></div>
  </div>
</div>

{{ chapter.title|json_script:"chapter-title-data" }}
{{ chapter.content|json_script:"chapter-content-data" }}

<script type="module">
  import { Editor } from 'https://esm.sh/@tiptap/core@2.11.5';
  import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.11.5';

  const storySlug = '{{ story.slug }}';
  const chapterNumber = {{ chapter.number }};
  const autosaveUrl = '{% url "editor:autosave" slug=story.slug number=chapter.number %}';
  const csrfToken = '{{ csrf_token }}';

  const titleInput = document.getElementById('chapter-title');
  titleInput.value = JSON.parse(document.getElementById('chapter-title-data').textContent);

  let initialContent = JSON.parse(document.getElementById('chapter-content-data').textContent);
  const isHtml = '{{ chapter.content_format }}' === 'html';
  if (!isHtml && initialContent) {
    initialContent = initialContent.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  }

  const editor = new Editor({
    element: document.getElementById('tiptap-editor'),
    extensions: [StarterKit],
    content: initialContent || '<p></p>',
    onUpdate: () => debouncedSave(),
  });

  let saveTimeout;
  function debouncedSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(save, 2000);
  }

  async function save() {
    const status = document.getElementById('save-status');
    status.textContent = 'Saving...';
    try {
      const resp = await fetch(autosaveUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
        body: JSON.stringify({
          title: titleInput.value,
          content: editor.getHTML(),
          content_format: 'html',
        }),
      });
      status.textContent = resp.ok ? 'Saved' : 'Error saving';
      if (resp.ok) setTimeout(() => { status.textContent = ''; }, 2000);
    } catch (e) {
      status.textContent = 'Error saving';
    }
  }

  titleInput.addEventListener('input', debouncedSave);
  document.getElementById('save-btn').addEventListener('click', save);

  document.querySelectorAll('.tiptap-toolbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const chain = editor.chain().focus();
      switch (action) {
        case 'bold': chain.toggleBold().run(); break;
        case 'italic': chain.toggleItalic().run(); break;
        case 'strike': chain.toggleStrike().run(); break;
        case 'h2': chain.toggleHeading({ level: 2 }).run(); break;
        case 'blockquote': chain.toggleBlockquote().run(); break;
        case 'bulletList': chain.toggleBulletList().run(); break;
        case 'orderedList': chain.toggleOrderedList().run(); break;
        case 'horizontalRule': chain.setHorizontalRule().run(); break;
        case 'undo': chain.undo().run(); break;
        case 'redo': chain.redo().run(); break;
      }
    });
  });

  document.getElementById('chapter-select').addEventListener('change', (e) => {
    window.location.href = `/editor/${storySlug}/${e.target.value}/`;
  });
</script>
{% endblock %}
